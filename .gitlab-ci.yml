# Define the stages of the CI/CD pipeline
stages:
  - build
  - deploy_dev
  - deploy_prod

# Define variables used across the pipeline
variables:
  # The name of the image that will be built and pushed to the GitLab Container Registry
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_IMAGE_TAG: $CI_REGISTRY_IMAGE:latest

# ======================================================================================
# BUILD STAGE: Build the Docker image and push it to the GitLab Container Registry
# ======================================================================================
build:
  stage: build
  # Use the official Docker image to build our image
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind # Docker-in-Docker service
  before_script:
    # Login to the GitLab Container Registry
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    # Build the image using the Dockerfile in the current directory
    - docker build -t $IMAGE_TAG -t $LATEST_IMAGE_TAG .
    # Push the image to the registry
    - docker push $IMAGE_TAG
    - docker push $LATEST_IMAGE_TAG
  # This job runs for all branches, but we don't need it for merge requests
  except:
    - merge_requests

# ======================================================================================
# DEPLOY STAGE (DEVELOPMENT): Deploy the application to the development server
# ======================================================================================
deploy_dev:
  stage: deploy_dev
  image: alpine:latest
  before_script:
    # Install necessary tools (ssh client, docker-compose)
    - apk add --no-cache openssh-client docker-compose
    # Prepare the SSH key to connect to the server
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    # Connect to the dev server and execute deployment commands
    - ssh $VPS_USER@$VPS_IP "
        cd ~/hui-manager-dev &&
        echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY &&
        export IMAGE_TAG=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA &&
        docker-compose -f docker-compose.dev.yml pull &&
        docker-compose -f docker-compose.dev.yml up -d --remove-orphans &&
        docker image prune -f"
  environment:
    name: development
    url: http://$VPS_IP:8080
  # This job runs ONLY for the 'dev' branch
  only:
    - dev

# ======================================================================================
# DEPLOY STAGE (PRODUCTION): Deploy the application to the production server
# ======================================================================================
deploy_prod:
  stage: deploy_prod
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - ssh $VPS_USER@$VPS_IP "
        cd ~/hui-manager-prod &&
        echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY &&
        export IMAGE_TAG=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA &&
        docker-compose -f docker-compose.prod.yml pull &&
        docker-compose -f docker-compose.prod.yml up -d --remove-orphans &&
        docker image prune -f"
  environment:
    name: production
    url: http://$PROD_DOMAIN # You should define PROD_DOMAIN in GitLab variables
  # This job runs ONLY for the 'main' branch
  only:
    - main
  # This makes the job require a manual trigger (a "play" button in the UI)
  when: manual
