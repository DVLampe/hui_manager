version: '3.8'

services:
  app_dev:
    image: $IMAGE_TAG
    container_name: hui-manager-app-dev
    restart: unless-stopped
    env_file: .env
    networks:
      - hui-net-dev

  socket_dev:
    image: $IMAGE_TAG
    container_name: hui-manager-socket-dev
    restart: unless-stopped
    command: ["node", "server.js"]
    env_file: .env
    networks:
      - hui-net-dev

  nginx_dev:
    image: nginx:1.25-alpine
    container_name: hui-manager-nginx-dev
    restart: unless-stopped
    ports:
      # Dev runs on port 8081 (staging takes 8080)
      - "8081:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app_dev
      - socket_dev
    networks:
      - hui-net-dev

networks:
  hui-net-dev:
    driver: bridge
