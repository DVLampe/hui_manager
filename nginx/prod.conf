# Upstream for the Next.js application
upstream app {
    server app:3000;
}

# Upstream for the Socket.IO server
upstream socket {
    server socket:3001;
}

# Server block that listens on port 80 (HTTP)
# It redirects all traffic to HTTPS
server {
    listen 80;
    server_name your_domain.com www.your_domain.com; # <-- IMPORTANT: Replace with your domain

    # This location is used by Certbot for the ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Server block for HTTPS
server {
    listen 443 ssl;
    server_name your_domain.com www.your_domain.com; # <-- IMPORTANT: Replace with your domain

    # SSL Certificate paths (Certbot will place them here)
    ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Main proxy to the Next.js app
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Special location for Socket.IO
    location /socket.io/ {
        proxy_pass http://socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
