# Upstream for the Next.js application (staging)
upstream app_staging {
    server app_staging:3000;
}

# Upstream for the Socket.IO server (staging)
upstream socket_staging {
    server socket_staging:3001;
}

# Server block for the staging environment (HTTP only, no SSL needed for internal review)
server {
    listen 80;
    server_name _;

    # Main proxy to the Next.js app
    location / {
        proxy_pass http://app_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Special location for Socket.IO
    location /socket.io/ {
        proxy_pass http://socket_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
