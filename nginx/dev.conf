# Upstream for the Next.js application (dev)
upstream app_dev {
    server app_dev:3000;
}

# Upstream for the Socket.IO server (dev)
upstream socket_dev {
    server socket_dev:3001;
}

# Server block for the development environment
server {
    listen 80;
    # You can use the server's IP or a dev-specific subdomain if you have one
    server_name _;

    # Main proxy to the Next.js app
    location / {
        proxy_pass http://app_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Special location for Socket.IO
    location /socket.io/ {
        proxy_pass http://socket_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
